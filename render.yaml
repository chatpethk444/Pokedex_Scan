# Render Blueprint: PokT backend (FastAPI + ONNX) + web demo (Expo static).
# Apply via Dashboard -> New -> Blueprint -> select this repo.
services:
  - type: web
    name: pokt-backend
    runtime: docker
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
  - type: web
    name: pokt-web
    env: static
    plan: free
    buildCommand: cd app && npm ci && npx expo export --platform web
    staticPublishPath: app/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
